name: Build and publish
on:
  push:
    tags:
      - '*'
jobs:
  build_and_deploy:
    name: build and publish
    runs-on: ubuntu-latest
    permissions:
      # GoReleaser creates the GitHub release; the Go SDK tag is pushed.
      contents: write
      # GitHub OIDC token for trusted publishing: NuGet/login exchanges it for a
      # short-lived nuget.org key; npm publish and the PyPI action use it directly.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unshallow to restore tags
        run: git fetch --prune --unshallow
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # GoReleaser runs `make tfgen` / `make build_sdks`, which build the
          # provider module — pin Go to the provider's requirement, not the SDK's.
          go-version-file: provider/go.mod
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # build_python runs setup.py, and Python 3.12+ no longer ships setuptools.
      - name: Install setuptools
        run: python -m pip install --upgrade setuptools
      - name: Install pulumictl
        run: curl -L https://github.com/pulumi/pulumictl/releases/download/v0.0.49/pulumictl-v0.0.49-linux-amd64.tar.gz | sudo tar zxv -C /usr/bin -f- pulumictl
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # sdk/go.mod lives in sdk/, so Go only sees a version through a tag named
      # sdk/vX.Y.Z. Tagged right after the build succeeds, so a failed build publishes
      # no Go version and a failed npm/NuGet/PyPI step does not hold Go back. A tag
      # pushed with GITHUB_TOKEN starts no workflow, and `tags: '*'` does not match '/'.
      - name: Tag Go SDK
        run: |
          git tag "sdk/${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          git push origin "sdk/${GITHUB_REF_NAME}"
      # The temporary key is valid for one hour and one exchange, so log in right
      # before the push rather than at the start of the job.
      - name: NuGet login (trusted publishing)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          # nuget.org profile name (not email) of the trusted-publishing policy owner.
          user: ${{ vars.NUGET_USER }}
      # No --skip-duplicate: nuget.org also answers 409 when it refuses a new ID under a
      # reserved prefix, and --skip-duplicate reports that as success. Instead, a version
      # nuget.org already lists is skipped, so a re-run after a later step failed gets past
      # NuGet; anything else is pushed and fails loudly. The listing can lag a fresh push by
      # some minutes, so re-run a failed release only after that.
      - name: Push NuGet package
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          pkgs=(nuget/*.nupkg)
          if [[ ${#pkgs[@]} -eq 0 ]]; then
            echo "::error::no .nupkg in nuget/"
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            nuspec=$(unzip -p "$pkg" '*.nuspec')
            id=$(sed -n 's:.*<id>\(.*\)</id>.*:\1:p' <<<"$nuspec" | head -n 1)
            version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' <<<"$nuspec" | head -n 1)
            if curl -fsS "https://api.nuget.org/v3-flatcontainer/${id,,}/index.json" 2>/dev/null |
              jq -e --arg v "${version,,}" '.versions | index($v) != null' >/dev/null; then
              echo "$id $version is already on nuget.org; skipping the push."
              continue
            fi
            dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
          done
      # Trusted publishing: npm exchanges the job's OIDC token itself and adds
      # provenance, so no token is stored. A pre-release (version with '-') goes to
      # the `next` dist-tag, so a plain `npm install` never picks it up.
      - name: Publish NPM package
        working-directory: sdk/nodejs/bin
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
      # Trusted publishing: the action exchanges the job's OIDC token for a
      # short-lived PyPI token, so no token is stored. pip skips a pre-release
      # (0.3.0a1) unless asked with --pre.
      - name: Publish Python package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/bin/dist/
          skip-existing: true
